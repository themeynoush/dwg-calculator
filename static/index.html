<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DWG 3D Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* palette: ink #271605 · accent #c47b07 · highlight #ffa81e (+ light tints of them) */
  :root {
    --ink: #271605; --accent: #c47b07; --highlight: #ffa81e;
    --line: rgb(196 123 7 / .35); --tint: rgb(255 168 30 / .08); --tint-strong: rgb(255 168 30 / .22);
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; font: 14px system-ui, sans-serif; color: var(--ink); }
  aside { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--tint); border-right: 1px solid var(--line); }
  header { padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; }
  button { cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px; padding: 4px 10px; }
  button:hover { border-color: var(--accent); }
  #refresh { background: var(--accent); border-color: var(--accent); color: #fff; }
  #refresh:hover { background: var(--ink); border-color: var(--ink); }
  button:disabled { opacity: .5; cursor: wait; }
  #list { flex: 1; overflow-y: auto; padding: 8px; }
  .card { display: block; width: 100%; text-align: left; padding: 6px; margin-bottom: 8px; border-radius: 8px; }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--highlight); }
  .card img { width: 100%; aspect-ratio: 4/3; background: var(--tint); border-radius: 4px; display: block; }
  .card .name { font-weight: 600; margin-top: 4px; word-break: break-all; }
  .card .meta { color: var(--accent); font-size: 12px; }
  .errors { color: var(--accent); font-weight: 600; font-size: 12px; padding: 0 4px; }
  .empty { color: var(--accent); padding: 12px 4px; }
  main { flex: 1; position: relative; background: #fff; }
  #viewer { width: 100%; height: 100%; display: block; }
  #hint { position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent); pointer-events: none; }
  #help { position: absolute; bottom: 8px; left: 12px; color: var(--accent); font-size: 12px; }

  /* material table + total */
  #legend { position: absolute; top: 8px; right: 8px; max-height: calc(100% - 16px); max-width: calc(100% - 16px);
            display: flex; flex-direction: column; background: rgb(255 255 255 / .94);
            border: 1px solid var(--line); border-radius: 8px; font-size: 12px; overflow: hidden; }
  #legend:empty { display: none; }
  #legend h2 { font-size: 12px; margin: 0; padding: 8px 10px; text-transform: uppercase; letter-spacing: .04em;
               color: var(--accent); border-bottom: 1px solid var(--line); }
  #legend .rows { overflow: auto; }
  #legend table { border-collapse: collapse; white-space: nowrap; }
  #legend th { position: sticky; top: 0; background: #fff; color: var(--accent); font-weight: 600; text-align: right;
               padding: 4px 8px; border-bottom: 1px solid var(--line); }
  #legend th:nth-child(-n+2) { text-align: left; }
  #legend td { padding: 2px 8px; text-align: right; font-variant-numeric: tabular-nums; }
  #legend td:nth-child(-n+2) { text-align: left; }
  #legend tbody tr:hover { background: var(--tint-strong); }
  #legend tr.off td:not(:first-child) { opacity: .4; }
  #legend td.na { color: var(--accent); }
  #legend label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #legend input { accent-color: var(--accent); margin: 0; }
  #legend .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgb(39 22 5 / .25); flex-shrink: 0; }
  #total { background: #ffa81e; color: #271605; margin: 8px; padding: 10px 12px; border-radius: 6px;
           display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  #total .label { font-size: 12px; }
  #total .amount { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #total .note { display: block; font-size: 11px; margin-top: 2px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<aside>
  <header><h1>DWG files</h1><button id="refresh">Refresh</button></header>
  <div id="list"></div>
</aside>
<main>
  <canvas id="viewer"></canvas>
  <div id="hint">Select a file on the left</div>
  <div id="legend"></div>
  <div id="help">Left drag: rotate · Right drag: pan · Wheel: zoom</div>
</main>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const loader = new GLTFLoader();
const cache = new Map();   // url → Promise<gltf scene>

function loadModel(url) {
  if (!cache.has(url)) cache.set(url, loader.loadAsync(url).then(g => g.scene));
  return cache.get(url).then(scene => styled(scene.clone()));
}

// Keep the per-layer material from the .glb (colour, mirror, glass...);
// just push faces back a little so outlines stay visible.
function styled(root) {
  root.traverse(obj => {
    if (obj.isMesh) {
      obj.material = obj.material.clone();
      Object.assign(obj.material, {
        side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
      });
      if (obj.material.transparent) obj.material.depthWrite = false;
    }
    if (obj.isLine || obj.isLineSegments) obj.material = new THREE.LineBasicMaterial({ color: 0x271605 });
  });
  return root;
}

// studio reflection map (one per renderer: GPU textures can't cross WebGL contexts)
// — makes mirrors and brass read as such
const envMaps = new WeakMap();

function makeScene(renderer) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);
  if (!envMaps.has(renderer)) {
    envMaps.set(renderer, new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture);
  }
  scene.environment = envMaps.get(renderer);
  scene.environmentIntensity = 0.6;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.position.set(2, 3, 1.5);
  scene.add(sun);
  return scene;
}

function frame(camera, object, controls) {
  const box = new THREE.Box3().setFromObject(object);
  const centre = box.getCenter(new THREE.Vector3());
  const radius = box.getBoundingSphere(new THREE.Sphere()).radius || 1;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
  camera.position.copy(centre).add(new THREE.Vector3(1, 0.8, 1).normalize().multiplyScalar(dist));
  camera.near = dist / 100; camera.far = dist * 100;
  camera.updateProjectionMatrix();
  camera.lookAt(centre);
  if (controls) { controls.target.copy(centre); controls.update(); }
}

// ---------- main viewer ----------
const canvas = document.getElementById("viewer");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
const scene = makeScene(renderer);
const grid = new THREE.GridHelper(2, 20, 0xe7bd83, 0xfbe9cf)   // tints of #c47b07 / #ffa81e;
grid.position.y = -0.5;
scene.add(grid);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
let current = null;

function resize() {
  const { clientWidth: w, clientHeight: h } = canvas;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

async function show(entry, card) {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("active", c === card));
  document.getElementById("hint").textContent = "Loading…";
  const model = await loadModel(entry.model_url);
  if (current) scene.remove(current);
  current = model;
  scene.add(model);
  grid.position.y = new THREE.Box3().setFromObject(model).min.y;
  frame(camera, model, controls);
  showLegend(model, entry.materials);
  document.getElementById("hint").textContent = "";
}

// ---------- material table (one row per CAD layer / material) + total ----------
const fmtM = v => v == null ? "—" : v.toFixed(2) + " m";
function fmtMoney(value, currency) {
  if (value == null) return "—";
  try {
    if (currency) return new Intl.NumberFormat(undefined, { style: "currency", currency }).format(value);
  } catch { /* not an ISO currency code: show it as text */ }
  const n = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
  return currency ? `${n} ${currency}` : n;
}
const UNIT_LABEL = { m2: "m²", "m²": "m²", sqm: "m²", m: "m" };

function showLegend(model, materials = []) {
  const legend = document.getElementById("legend");
  const takeoff = new Map(materials.map(m => [m.layer, m]));
  const groups = new Map();   // material name → meshes
  model.traverse(obj => {
    if (!obj.isMesh || !obj.material.name || obj.material.name === "faces") return;
    if (!groups.has(obj.material.name)) groups.set(obj.material.name, []);
    groups.get(obj.material.name).push(obj);
  });
  if (!groups.size) { legend.innerHTML = ""; return; }

  legend.innerHTML = `
    <h2>Materials</h2>
    <div class="rows"><table>
      <thead><tr>
        <th><label title="Select all / none"><input type="checkbox" class="all" checked></label></th>
        <th>Material</th><th title="Length">L</th><th title="Width">W</th><th title="Height">H</th><th>Price / unit</th><th>Price</th>
      </tr></thead>
      <tbody></tbody>
    </table></div>
    <div id="total"></div>`;
  const tbody = legend.querySelector("tbody");
  const rows = [];
  for (const [name, meshes] of [...groups].sort(([a], [b]) => a.localeCompare(b))) {
    const m = takeoff.get(name) || {};
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><label><input type="checkbox" checked><span class="swatch"></span></label></td>
      <td></td><td></td><td></td><td></td><td></td><td></td>`;
    const cells = tr.querySelectorAll("td");
    tr.querySelector(".swatch").style.background = "#" + meshes[0].material.color.getHexString(THREE.SRGBColorSpace);
    cells[1].textContent = name;
    cells[2].textContent = fmtM(m.length_m);
    cells[3].textContent = fmtM(m.width_m);
    cells[4].textContent = fmtM(m.height_m);
    cells[5].textContent = m.unit_price == null ? "—"
      : `${fmtMoney(m.unit_price, m.currency)} / ${UNIT_LABEL[m.unit] || m.unit}`;
    cells[6].textContent = fmtMoney(m.price, m.currency);
    if (m.area_m2 != null) cells[6].title = `Surface L × W: ${m.area_m2.toFixed(2)} m²`;
    cells.forEach((c, i) => { if (i >= 2 && c.textContent === "—") c.classList.add("na"); });
    const box = tr.querySelector("input");
    box.onchange = () => {
      meshes.forEach(mesh => { mesh.visible = box.checked; });
      tr.classList.toggle("off", !box.checked);
      updateTotal();
    };
    tbody.append(tr);
    rows.push({ box, tr, material: m });
  }

  const all = legend.querySelector("input.all");
  all.onchange = () => rows.forEach(r => {
    if (r.box.checked !== all.checked) { r.box.checked = all.checked; r.box.onchange(); }
  });

  function updateTotal() {
    const chosen = rows.filter(r => r.box.checked);
    const sums = new Map();   // currency → total (prices in different currencies are not added up)
    for (const { material: m } of chosen) {
      if (m.price == null) continue;
      sums.set(m.currency || "", (sums.get(m.currency || "") || 0) + m.price);
    }
    const unpriced = chosen.filter(r => r.material.price == null).length;
    const amount = sums.size ? [...sums].map(([cur, v]) => fmtMoney(v, cur)).join(" + ") : fmtMoney(0, "");
    const total = document.getElementById("total");
    total.innerHTML = `<span><span class="label"></span><span class="note"></span></span><span class="amount"></span>`;
    total.querySelector(".label").textContent = `Total price · ${chosen.length} of ${rows.length} layers selected`;
    total.querySelector(".note").textContent = unpriced ? `${unpriced} selected layer(s) without a price` : "";
    total.querySelector(".amount").textContent = amount;
    all.checked = chosen.length === rows.length;
    all.indeterminate = chosen.length > 0 && chosen.length < rows.length;
  }
  updateTotal();
}

// ---------- thumbnails (one shared offscreen renderer) ----------
const thumbRenderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
thumbRenderer.setSize(240, 180);
const thumbCamera = new THREE.PerspectiveCamera(45, 4 / 3, 0.01, 100);

async function thumbnail(url) {
  const s = makeScene(thumbRenderer);
  const model = await loadModel(url);
  s.add(model);
  frame(thumbCamera, model);
  thumbRenderer.render(s, thumbCamera);
  return thumbRenderer.domElement.toDataURL("image/png");
}

// ---------- sidebar ----------
const list = document.getElementById("list");
const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.ceil(b / 1e3) + " KB";

async function render(catalog) {
  list.innerHTML = "";
  if (!catalog.models.length) {
    list.innerHTML = '<div class="empty">No models yet. Put .dwg files in the <code>uploads/</code> folder and click Refresh.</div>';
  }
  const cards = catalog.models.map(entry => {
    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML = `<img alt=""><div class="name"></div><div class="meta"></div>`;
    card.querySelector(".name").textContent = entry.name;
    card.querySelector(".meta").textContent = `${entry.source} · ${fmtSize(entry.size_bytes)}`;
    card.onclick = () => show(entry, card);
    list.append(card);
    return [entry, card];
  });
  for (const [name, reason] of Object.entries(catalog.errors || {})) {
    const div = document.createElement("div");
    div.className = "errors";
    div.textContent = `⚠ ${name}: ${reason}`;
    list.append(div);
  }
  for (const [entry, card] of cards) {   // sequential: keeps the browser responsive
    try { card.querySelector("img").src = await thumbnail(entry.model_url); }
    catch (e) { console.error(entry.name, e); }
  }
}

const refreshBtn = document.getElementById("refresh");
refreshBtn.onclick = async () => {
  refreshBtn.disabled = true; refreshBtn.textContent = "Processing…";
  try {
    cache.clear();
    await render(await (await fetch("/api/refresh", { method: "POST" })).json());
  } finally { refreshBtn.disabled = false; refreshBtn.textContent = "Refresh"; }
};

render(await (await fetch("/api/catalog")).json());
</script>
</body>
</html>
