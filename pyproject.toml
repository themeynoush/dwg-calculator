[project]
name = "dwg-viewer"
version = "0.1.0"
description = "Browse and view DWG files in 3D from the browser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.5",
    "fastapi>=0.165.0",
    "langgraph>=1.2.24",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "trimesh>=5.2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
